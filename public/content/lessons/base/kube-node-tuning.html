<h1 id="kube-node-tuning">kube-node-tuning<a class="heading-anchor" aria-hidden tabindex="-1" href="#kube-node-tuning">#</a></h1>
<p><a href="https://github.com/kubean-io/kube-node-tuning">kube-node-tuning</a> 旨在通过 Kubernetes 进行内核调优。它适用于：</p>
<ul>
<li>高性能应用</li>
<li>大规模集群</li>
<li>网络调优</li>
</ul>

<p>通过 SSH 访问节点，查看配置：</p>
<ul>
<li>执行 <code>cat /etc/sysctl.d/99-kube-node-tuning.conf</code> 配置文件内容</li>
<li>执行 <code>sysctl -a</code> 查看生效参数</li>
</ul>
