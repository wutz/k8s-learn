<h1 id="soperator">Soperator<a class="heading-anchor" aria-hidden tabindex="-1" href="#soperator">#</a></h1>
<blockquote>
<p>施工中，不要用于生产环境</p>
</blockquote>
<p><a href="https://github.com/nebius/soperator">Soperator</a> 在 Kubernetes 中运行 Slurm。</p>
<h2 id="前置">前置<a class="heading-anchor" aria-hidden tabindex="-1" href="#前置">#</a></h2>
<ul>
<li>K8S 集群版本要求 1.30 或以上</li>
<li>CNI 必须支持<strong>保留客户端源 IP</strong>，其中 Cilium 经过测试</li>
<li>PVC 支持共享文件系统, 例如 NFS 或 CephFS</li>
<li><a href="https://github.com/wutz/k8s-in-action/blob/main/ai/nfd/">NFD</a> 已部署</li>
</ul>
