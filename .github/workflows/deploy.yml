name: Deploy to Cloudflare Workers

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        # 版本读取 package.json 的 packageManager 字段

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # 内容产物已提交进 git，CI 直接构建（刷新内容在本地跑 pnpm content:build 后提交）

      - run: pnpm build

      - name: Typecheck
        run: pnpm exec tsc --noEmit

      - name: Check deploy credential
        id: cred
        run: echo "has_token=${{ secrets.CLOUDFLARE_API_TOKEN != '' }}" >> "$GITHUB_OUTPUT"

      - name: Deploy
        if: steps.cred.outputs.has_token == 'true'
        run: pnpm exec wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}

      - name: Skip notice
        if: steps.cred.outputs.has_token != 'true'
        run: echo "未配置 CLOUDFLARE_API_TOKEN secret，跳过部署（本地可用 pnpm run deploy）"
